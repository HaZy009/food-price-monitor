name: Update food price data

on:
  schedule:
    - cron: "17 8 5 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download latest Statistics Canada data
        run: npm run data:download

      - name: Generate application dataset
        run: npm run data:update

      - name: Verify application build
        run: npm run build

      - name: Commit updated dataset
        run: |
          if git diff --quiet -- src/data/foodPrices.json; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/foodPrices.json
          git commit -m "Update Statistics Canada food price data"
          git push